<!DOCTYPE html>

<head>

<title>Checkout Cancelled — YueVoice</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a0f;color:#e0e0e0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px}
.card{background:#1a1a2e;border:1px solid #333;border-radius:20px;padding:48px;max-width:480px;width:100%;text-align:center}
.icon{font-size:64px;margin-bottom:20px}
h1{background:linear-gradient(90deg,#f27121,#e94560);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:36px;margin-bottom:16px}
p{color:#aaa;font-size:16px;line-height:1.6;margin-bottom:24px}
.btn{display:inline-block;background:#e94560;color:#fff;padding:14px 36px;border-radius:8px;text-decoration:none;font-weight:bold;font-size:16px;transition:transform .2s}
.btn:hover{transform:translateY(-2px)}
.btn.secondary{background:transparent;border:2px solid #e94560;color:#e94560;margin-left:12px}
.btn.secondary:hover{background:#e94560;color:#fff}
.note{background:#2a1a1a;border-left:4px solid #e94560;padding:20px;margin:24px 0;border-radius:0 8px 8px 0;text-align:left}
.note h3{color:#ffd700;margin-bottom:8px;font-size:14px}
.note p{color:#aaa;font-size:13px;margin:0}

</head>

  <a href="/index.html" class="btn secondary">View Landing Page</a>
</div>

</html>
